<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Timeally — 自分の記録</title>
    <link rel="icon" href="icons/favicon-32.png?v=fec9f654" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=fec9f654" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Timeally" />
    <meta name="theme-color" content="#FFC72C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/timeally.css?v=fec9f654" />
  </head>
  <body>
    <div class="tc-appbar">
      <h1>Timeally</h1>
      <span class="tc-spacer"></span>
      <span class="tc-sub" id="who"></span>
      <!-- ★別のページへ移る物は いつでも 帯のいちばん右★（全画面で同じ場所・2026-08-16） -->
      <a class="tc-btn sub tc-nav" id="to-punch" href="#">← 打つ画面へ</a>
    </div>

    <div class="tc-wrap" id="main" hidden>
      <!-- ★説明は1行★（2026-08-18 夜 司さん「複雑すぎんか？」）
           ＝画面が やっている事は 見れば分かる。★3行の説明は 打刻2日ぶんの高さ★を食う。 -->
      <div class="tc-note">
        あなたが打った時刻です。直したい所は 押してください。
      </div>

      <!-- ★締め切りの知らせ★ 打った時刻は締め切った後も そのまま見えたまま -->
      <div class="tc-alert" id="closed-note" hidden></div>

      <div class="tc-tabs">
        <button class="tc-btn sub" id="b-prev" type="button">前の月</button>
        <span class="tc-btn sub" id="ymlabel" style="pointer-events: none"></span>
        <button class="tc-btn sub" id="b-next" type="button">次の月</button>
      </div>

      <div id="list"></div>

      <!-- ★既定で畳む★（2026-08-18 夜 司さん「なんか複雑すぎんか？」）
           ＝記録の画面は「打った時刻が並ぶ」のが主。★押した時だけ開く★。
           ★押す物を画面に1つ★にする為でもある（打刻の直しと同時に出さない）。 -->
      <p><button class="tc-btn sub wide" id="b-addopen" type="button" aria-expanded="false">
        あとから入れる（打ち忘れた日）</button></p>
      <div id="add-box" hidden>
      <div class="tc-note">打ち忘れた日は、ここから入れられます。</div>
      <label for="ad">日</label>
      <div id="ad-wrap"></div>
      <label for="at">時刻</label>
      <input type="time" id="at" step="60" />
      <label for="ak">どれ</label>
      <select id="ak">
        <option value="in">出勤</option>
        <option value="out">退勤</option>
        <option value="break_in">休憩に入る</option>
        <option value="break_out">休憩から戻る</option>
        <option value="away_in">私用で外出</option>
        <option value="away_out">外出から戻る</option>
      </select>
      <label for="ar">ひとこと（打ち忘れた理由など）</label>
      <input type="text" id="ar" />
      <!-- ★出す前に1行 見せる★／★日・時刻・どれ が揃うまで押せない★
           （2026-08-18 司さん「時間変更する前に間違えて押した時の仕様を見直すべきやろ」）
           ＝時刻が --:-- のまま 押せてしまうのが 今までの穴。 -->
      <div class="tc-note" id="add-why"></div>
      <p><button class="tc-btn wide" id="b-add" type="button" disabled>足す</button></p>
      </div>
    </div>

    <div class="tc-overlay" id="gate">
      <div class="tc-panel">
        <h2 id="gate-title">暗証番号</h2>
        <div class="tc-note" id="gate-note" hidden></div>
        <div id="gate-alert" class="tc-alert" hidden></div>

        <!-- ★まだ暗証番号を決めていない人★
             ここに2つ目の入口は作らない（★入口が2つあると 片方だけ直す事故が必ず起きる★）。
             決める場所は打つ画面の1か所だけ。★?t= を落とさずに渡し、決め終わったらここへ戻す★ -->
        <div id="gate-first" hidden>
          <p><a class="tc-btn wide" id="to-setpw" href="#">暗証番号を決める（打つ画面へ）</a></p>
        </div>

        <div id="gate-again">
          <label for="pin">暗証番号</label>
          <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="6" />
          <p><button class="tc-btn wide" id="b-verify" type="button">入る</button></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supa-config.js?v=fec9f654"></script>
    <script src="js/env-badge.js?v=fec9f654"></script>
    <script src="lib/tc-pin.js?v=fec9f654"></script>
    <!-- ★打った物の「使う／使わない」と「聞く事」を決める1本★
         ★長さ（働いた分・追加ぶん・夜の分・お金）は1つも数えない★ので この画面から読んでよい。
         社長の画面も 数える所も ★同じこの1本★を見る＝食い違わない。
         （★この画面に 数える道具の名前すら書かない★＝見張りが名前で数えているため） -->
    <script src="lib/tc-clean.js?v=fec9f654"></script>
    <script src="js/tc-ui.js?v=fec9f654"></script>
    <script src="js/tc-db.js?v=fec9f654"></script>
    <script src="js/emp-app.js?v=fec9f654"></script>
    <script>
      EmpApp.startKiroku();
    </script>
  </body>
</html>
