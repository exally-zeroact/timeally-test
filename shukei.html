<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Timeally — 集計・印刷</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFC72C'/%3E%3Cpath d='M16 8v8l5 3' stroke='%232B2418' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/timeally.css?v=140ee797" />
  </head>
  <body>
    <div class="tc-appbar">
      <h1>Timeally</h1>
      <span class="tc-sub">集計・印刷</span>
      <span class="tc-spacer"></span>
      <a class="tc-btn sub" href="index.html?v=140ee797">一覧へ</a>
    </div>

    <div class="tc-wrap" id="main" hidden>
      <div class="tc-tabs">
        <button class="tc-btn sub" id="b-prev" type="button">前の月</button>
        <span class="tc-btn sub" id="ymlabel" style="pointer-events: none"></span>
        <button class="tc-btn sub" id="b-next" type="button">次の月</button>
        <select id="who" style="width: auto; min-width: 160px"></select>
      </div>

      <div class="tc-note" id="period"></div>
      <div class="tc-alert" id="cutbox" hidden></div>

      <h2>日ごと</h2>
      <div class="tc-tablewrap"><table class="tc" id="daily"></table></div>

      <h2>月計</h2>
      <div class="tc-tablewrap"><table class="tc" id="total"></table></div>

      <h2>気づき</h2>
      <div id="warns"></div>

      <h2>渡す</h2>
      <div class="tc-note" id="namehint"></div>
      <div class="tc-tabs">
        <button class="tc-btn" id="b-print" type="button">印刷</button>
        <button class="tc-btn sub" id="b-csv" type="button">この人の日ごと（CSV）</button>
        <button class="tc-btn sub" id="b-kyuyo" type="button">給与へ渡す（全員・CSV）</button>
        <button class="tc-btn sub" id="b-xlsx" type="button">Excel（全員）</button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supa-config.js?v=140ee797"></script>
    <script src="js/env-badge.js?v=140ee797"></script>
    <script src="lib/tc-law.js?v=140ee797"></script>
    <script src="lib/tc-calc.js?v=140ee797"></script>
    <script src="lib/tc-csv.js?v=140ee797"></script>
    <script src="lib/tc-name.js?v=140ee797"></script>
    <script src="js/file-out.js?v=140ee797"></script>
    <script src="js/tc-ui.js?v=140ee797"></script>
    <script src="js/tc-db.js?v=140ee797"></script>
    <script src="js/owner-app.js?v=140ee797"></script>
    <script>
      OwnerApp.startShukei();
    </script>
  </body>
</html>
