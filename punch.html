<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Timeally — 打刻</title>
    <link rel="icon" href="icons/favicon-32.png?v=6845bab2" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=6845bab2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Timeally" />
    <meta name="theme-color" content="#FFC72C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/timeally.css?v=6845bab2" />
  </head>
  <body>
    <div class="tc-appbar">
      <h1>Timeally</h1>
      <span class="tc-spacer"></span>
      <span class="tc-sub" id="who"></span>
      <!-- ★別のページへ移る物は いつでも 帯のいちばん右★（全画面で同じ場所・2026-08-16） -->
      <a class="tc-btn sub tc-nav" id="to-kiroku" href="#">記録へ →</a>
    </div>

    <div class="tc-wrap" id="main" hidden>
      <div class="tc-note" id="hello"></div>

      <!-- ★締め切りの知らせ★ 出る文は倉庫が作った1文だけ（空なら箱ごと出ない） -->
      <div class="tc-alert" id="closed-note" hidden></div>

      <!-- ★いまの状態★（2026-08-18 司さん「出勤押してもないのに退勤おせるとか」）
           ★状態を決めるのは lib/tc-clean.js の1か所だけ★（画面で言い換えない）。 -->
      <div class="tc-statenow" id="state-now"></div>

      <label for="t">打った時刻（直せます）</label>
      <input type="time" id="t" step="60" />
      <!-- ★選んだ時刻が「最後に打った時刻より前」なら押せない★＝過去へ戻らせない -->
      <div class="tc-alert" id="t-why" hidden></div>

      <!-- ★休憩のボタンは置かない★（2026-08-15 司さんの指摘）
           ＝現場は押さない。押さない物を前提にすると ★押し忘れがそのまま残業になる★。
           休憩は 会社の決まりの分を 集計の側で引く。
           ★私用で外出は残す★＝中抜けは毎日 同じ長さではないので 既定で代われない。
           ★2026-08-18 いまの状態で押してよい物だけ出す★
             （押せない物は灰色＋理由／その状態で意味の無い物は そもそも出さない）。 -->
      <div class="tc-punchgrid">
        <button class="tc-btn" id="b-in" type="button">出勤</button>
        <button class="tc-btn" id="b-out" type="button">退勤</button>
        <button class="tc-btn sub" id="b-ain" type="button">私用で外出</button>
        <button class="tc-btn sub" id="b-aout" type="button">外出から戻る</button>
      </div>
      <!-- ★押せない理由は 押せない物のすぐ下★（別の所で理由を探させない） -->
      <div class="tc-note" id="deny-why" hidden></div>

      <!-- ★打った直後だけ 自分で取り消せる★（★取り消したら 会社には何も出ない★）
           ここで直せば「お願い」も要らない＝会社の手間も増えない。 -->
      <div class="tc-undo" id="undo" hidden>
        <span class="tc-undo-what" id="undo-what"></span>
        <button class="tc-btn danger" id="b-undo" type="button">取り消す</button>
      </div>

      <!-- ★出勤を打ち間違えた人の逃げ道★（出勤中の時だけ出す） -->
      <p><a class="tc-btn quiet" id="to-fix" href="#" hidden>出勤を打ち間違えた</a></p>

      <div class="tc-note">
        押すと、いま欄に入っている時刻がそのまま残ります。あとから見返せます。
        お昼などの休憩は 押さなくてかまいません（会社の決まりのぶんで扱われます）。
      </div>

      <p><button class="tc-btn sub wide" id="b-forget" type="button">この端末を忘れる</button></p>
    </div>

    <!-- 入口（暗証番号）。★被せ物なので、テスト環境の帯は これを下げない★ -->
    <div class="tc-overlay" id="gate">
      <div class="tc-panel">
        <h2 id="gate-title">はじめての方</h2>
        <div class="tc-note" id="gate-note" hidden></div>
        <div id="gate-alert" class="tc-alert" hidden></div>

        <!-- ★従業員が持つ秘密は これ1つだけ★（2026-08-15 司さんの指摘）。
             ★毎日 現場のスマホで打つ物★なので 数字キーボードが出る形にする。 -->
        <div id="gate-first">
          <label for="pin1">これから使う 暗証番号（数字4〜6桁）</label>
          <input type="password" id="pin1" inputmode="numeric" autocomplete="new-password" maxlength="6" />
          <label for="pin2">もう一度</label>
          <input type="password" id="pin2" inputmode="numeric" autocomplete="new-password" maxlength="6" />
          <p><button class="tc-btn wide" id="b-setpin" type="button">決める</button></p>
        </div>

        <div id="gate-again" hidden>
          <label for="pin">暗証番号</label>
          <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="6" />
          <p><button class="tc-btn wide" id="b-verify" type="button">入る</button></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supa-config.js?v=6845bab2"></script>
    <script src="js/env-badge.js?v=6845bab2"></script>
    <script src="lib/tc-pin.js?v=6845bab2"></script>
    <!-- ★いまの状態（押してよい物）を決める1本★
         ★長さは1つも数えない★ので この画面から読んでよい（社長の画面と同じ物を見る）。 -->
    <script src="lib/tc-clean.js?v=6845bab2"></script>
    <script src="js/tc-ui.js?v=6845bab2"></script>
    <script src="js/tc-db.js?v=6845bab2"></script>
    <script src="js/emp-app.js?v=6845bab2"></script>
    <script>
      EmpApp.startPunch();
    </script>
  </body>
</html>
