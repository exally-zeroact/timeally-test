<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Timeally — 一覧</title>
    <link rel="icon" href="icons/favicon-32.png?v=5319a9df" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5319a9df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Timeally" />
    <meta name="theme-color" content="#FFC72C" />
    <link rel="manifest" href="manifest.json?v=5319a9df" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/timeally.css?v=5319a9df" />
  </head>
  <body>
    <div class="tc-appbar">
      <h1>Timeally</h1>
      <span class="tc-sub" id="coname"></span>
      <span class="tc-spacer"></span>
      <!-- ★「出る」はタブと同じ形にしない★（同じ形だとタブだと思って押す。実機で踏んだ） -->
      <button class="tc-btn quiet" id="b-signout" type="button">ログアウト</button>
      <!-- ★別のページへ移る物は いつでも 帯のいちばん右★（2026-08-16 司さん
           「戻るが集計の時だけ右上にある」）＝★置き場所を1つに決める★。
           タブ（会社／従業員／今月の勤務）は同じページの中なので 帯には出さない。 -->
      <a class="tc-btn go tc-nav" id="go-shukei" href="shukei.html?v=5319a9df">集計へ →</a>
    </div>

    <div class="tc-wrap" id="main" hidden>
      <!-- ★左から 会社／従業員／今月の勤務★
           ★タブの名前は「何が分かるか」にする★（2026-08-16 司さん「一覧が何か分からない」）
           ★別ページへ飛ぶ「集計へ →」は 帯の右端★（この列には置かない） -->
      <div class="tc-tabs" role="tablist">
        <button class="tc-btn sub" id="tab-company" type="button" role="tab" aria-selected="false">会社</button>
        <button class="tc-btn sub" id="tab-people" type="button" role="tab" aria-selected="false">従業員</button>
        <button class="tc-btn sub" id="tab-list" type="button" role="tab" aria-selected="true">今月の勤務</button>
      </div>

      <!-- 出るを押した時の確認（★白紙のダイアログを開かない・画面の中で聞く★） -->
      <div class="tc-alert" id="signout-ask" hidden>
        <span id="signout-ask-text"></span>
        <span class="tc-askrow">
          <button class="tc-btn danger" id="b-signout-yes" type="button">ログアウト</button>
          <button class="tc-btn sub" id="b-signout-no" type="button">やめる</button>
        </span>
      </div>

      <!-- ① 一覧（★未承認のお願いが上★） -->
      <section id="pane-list">
        <!-- ★何が分かる画面かを 頭に1行★（2026-08-16 司さん「何のためにあるか分からない」） -->
        <div class="tc-lead">今月 誰が何時間 働いたかを 全員ぶん並べます。直しのお願いは いちばん上に出ます。</div>
        <h2>直しのお願い（未承認が上）</h2>
        <div id="fixes"></div>

        <h2>今月の打刻</h2>
        <div class="tc-tabs">
          <button class="tc-btn sub" id="b-prev" type="button">前の月</button>
          <span class="tc-btn sub" id="ymlabel" style="pointer-events: none"></span>
          <button class="tc-btn sub" id="b-next" type="button">次の月</button>
        </div>
        <div id="people-summary"></div>
      </section>

      <!-- ② 従業員（入口の発行・QR） -->
      <section id="pane-people" hidden>
        <h2>従業員</h2>
        <div class="tc-note">
          1人ずつ「入口のリンク」を作ります。リンクを渡すと、本人が暗証番号（数字4〜6桁）を決めて
          本人がスマホで打てるようになります。
        </div>
        <!-- ★人数を頭に出す★／★状態で絞れる★（20人でも探せるように・2026-08-16） -->
        <div class="tc-lead" id="people-count"></div>
        <div class="tc-tabs" id="people-filter" hidden>
          <button class="tc-btn sub" type="button" data-filter="all" aria-selected="true">全員</button>
          <button class="tc-btn sub" type="button" data-filter="yet" aria-selected="false">まだ打てない人</button>
        </div>
        <div id="people"></div>

        <h3>追加する</h3>
        <label for="p-name">氏名（給与に渡すときに使います）</label>
        <input type="text" id="p-name" />
        <label for="p-no">従業員番号（任意）</label>
        <input type="text" id="p-no" />
        <label for="p-hire">入社日（有給の判定に使います・任意）</label>
        <div id="p-hire-wrap"></div>
        <label for="p-hol">法定休日（この人だけ別にする時）</label>
        <select id="p-hol">
          <option value="">会社の決まりに従う</option>
          <option value="0">日</option><option value="1">月</option><option value="2">火</option>
          <option value="3">水</option><option value="4">木</option><option value="5">金</option>
          <option value="6">土</option>
        </select>
        <label for="p-yen">時給（切り捨てた金額を出すのに使います・任意）</label>
        <input type="number" id="p-yen" inputmode="numeric" />
        <p><button class="tc-btn wide" id="b-addperson" type="button">この人の入口を作る</button></p>
      </section>

      <!-- ③ 会社情報 -->
      <section id="pane-company" hidden>
        <h2>会社情報</h2>
        <label for="c-name">会社名</label>
        <input type="text" id="c-name" />
        <label for="c-close">締め日（31 は末日締め）</label>
        <input type="number" id="c-close" inputmode="numeric" min="1" max="31" />
        <label for="c-daily">1日の所定</label>
        <span class="tc-unitrow">
          <input type="text" id="c-daily" inputmode="decimal" placeholder="8" autocomplete="off" />
          <button class="tc-btn unit" type="button" id="c-daily-h" data-unit="hour" aria-selected="true">時間</button>
          <button class="tc-btn unit" type="button" id="c-daily-m" data-unit="minute" aria-selected="false">分</button>
        </span>
        <span class="tc-note" id="c-daily-hint"></span>
        <label for="c-week">1週の所定</label>
        <span class="tc-unitrow">
          <input type="text" id="c-week" inputmode="decimal" placeholder="40" autocomplete="off" />
          <button class="tc-btn unit" type="button" id="c-week-h" data-unit="hour" aria-selected="true">時間</button>
          <button class="tc-btn unit" type="button" id="c-week-m" data-unit="minute" aria-selected="false">分</button>
        </span>
        <span class="tc-note" id="c-week-hint"></span>
        <label for="c-break">休憩の既定</label>
        <span class="tc-unitrow">
          <input type="text" id="c-break" inputmode="decimal" placeholder="1" autocomplete="off" />
          <button class="tc-btn unit" type="button" id="c-break-h" data-unit="hour" aria-selected="true">時間</button>
          <button class="tc-btn unit" type="button" id="c-break-m" data-unit="minute" aria-selected="false">分</button>
        </span>
        <span class="tc-note" id="c-break-hint"></span>
        <!-- ★休憩の既定が 法律で必要な分を下回っている時の赤★（設定の間違いは その場で言う）
             ★黙って引き上げない★＝数字は会社が入れた物のまま使う -->
        <div class="tc-alert" id="c-break-law" hidden></div>
        <label for="c-holmode">法定休日の決め方</label>
        <select id="c-holmode">
          <option value="none">決めていない（就業規則で特定していない）</option>
          <option value="dow">曜日で決める（全員おなじ曜日）</option>
          <option value="per_person">従業員ごとに曜日で決める</option>
          <option value="w4d4">4週4日制（変形休日制）</option>
        </select>
        <div id="hol-dow" hidden>
          <label for="c-holiday">曜日（会社の決まり）</label>
          <select id="c-holiday">
            <option value="-1">未選択</option>
            <option value="0">日</option><option value="1">月</option><option value="2">火</option>
            <option value="3">水</option><option value="4">木</option><option value="5">金</option>
            <option value="6">土</option>
          </select>
          <span class="tc-note" id="hol-override"></span>
        </div>
        <div id="hol-cycle" hidden>
          <label for="c-holcycle">4週間の起算日（就業規則で決めた日）</label>
          <div id="c-holcycle-wrap"></div>
        </div>
        <div class="tc-note" id="holiday-note"></div>
        <div class="tc-alert" id="holiday-warn" hidden></div>

        <h3>時間の丸め方（会社の決まり）</h3>
        <div class="tc-note" id="round-note"></div>
        <label for="c-round">決め方</label>
        <select id="c-round">
          <option value="none">1分単位のまま（おすすめ）</option>
          <option value="month">1か月の合計の端数だけ整える</option>
          <option value="custom">自分で決める</option>
        </select>
        <div id="round-custom" hidden>
          <label for="c-runit">単位</label>
          <select id="c-runit"></select>
          <label for="c-rdir">向き</label>
          <select id="c-rdir">
            <option value="floor">切り捨て</option>
            <option value="ceil">切り上げ</option>
            <option value="round">四捨五入</option>
          </select>
          <label for="c-rscope">かける先</label>
          <select id="c-rscope">
            <option value="day">日ごと</option>
            <option value="month">1か月の合計</option>
          </select>
        </div>
        <!-- ★長い注意は 頭の1行だけ出し、続きは畳む★（2026-08-16 司さん「分かりにくい」）
             ★畳んでも「押せば全部 読める」★＝法律の話を短くして終わりにはしない -->
        <div class="tc-alert" id="round-warn" hidden>
          <span id="round-warn-head"></span>
          <button class="tc-btn sub small" id="b-warn-more" type="button">くわしく</button>
          <span id="round-warn-rest" hidden></span>
        </div>
        <!-- ★例は 押した時だけ出す★（既定で使う人には見せない） -->
        <p><button class="tc-btn sub small" id="b-round-ex" type="button">例を見る</button></p>
        <div class="tc-note" id="round-example" hidden></div>

        <!-- ★紙の綴じ代の設定は 2026-08-15 に外した★（司さんの決定）
             ＝★勤務表は必ず綴じる紙★なので ★いつでも四辺20mm★。人が決める事を1つ減らす。
             ★「実際のサイズ（100%）で刷ってください」は 刷る画面（集計）へ移した★
             （★直す所の隣で言う★＝押す直前に読める）。 -->

        <!-- ★「気づき（警告）」は 2026-08-15 に丸ごと外した★（司さんの決定）。
             ★休憩の既定が法定を下回る赤★は 休憩の欄のすぐ下に移した（設定の間違いは その場で言う）。
             ★丸めの適法性★と★法定休日の決め方★の説明は 今までどおり それぞれの欄に出る。 -->
        <p><button class="tc-btn wide" id="b-savecompany" type="button">保存する</button></p>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supa-config.js?v=5319a9df"></script>
    <script src="js/env-badge.js?v=5319a9df"></script>
    <script src="lib/tc-law.js?v=5319a9df"></script>
    <!-- ★tc-calc より先に読む★（打った物の掃除＝連打をまとめる／決められない日を見つける。
         tc-calc.js は これが無いと数えられない） -->
    <script src="lib/tc-clean.js?v=5319a9df"></script>
    <script src="lib/tc-calc.js?v=5319a9df"></script>
    <script src="lib/tc-csv.js?v=5319a9df"></script>
    <script src="lib/tc-name.js?v=5319a9df"></script>
    <script src="lib/tc-hours.js?v=5319a9df"></script>
    <script src="lib/qr.js?v=5319a9df"></script>
    <script src="js/file-out.js?v=5319a9df"></script>
    <script src="js/tc-ui.js?v=5319a9df"></script>
    <script src="js/tc-db.js?v=5319a9df"></script>
    <script src="js/owner-app.js?v=5319a9df"></script>
    <script>
      OwnerApp.startIndex();
    </script>
  </body>
</html>
