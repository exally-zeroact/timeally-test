name: mirror-watch

# ★テスト線の 側から 本番を 見る★（Timeally・2026-10-20）
#   本番の 中で 見張り（ci.yml・vercel.json）ごと 外されても、★本番の 外★の ここが 捕まえる。
#   ・本番 main の 木が 写した印（mirror-from.txt）の テスト線の commit と 同じか（違うのは 設定の 値と ?v= の 刻印 だけ）
#   ・写していない テスト線の commit が 7日 以上 前から 在れば 赤（★遅れ★＝前科「staging だけ直して 本番が6日 そのまま」）
#   ・本番を 取れない・GitHub が 読めない は 赤（★材料が 無いのに 緑を 返さない★）
# ★毎日の 回は 遅れたり 飛んだり する★（GitHub の 都合）＝テスト線への push でも 走らせる。
# ★本番 repo にも 写される★ が、走るのは テスト線だけ（if）。

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  watch:
    if: github.repository == 'exally-zeroact/timeally-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 本番がテスト線と同じで、遅れていないか
        run: node tests/mirror-match.test.mjs --watch-prod
        env:
          GITHUB_TOKEN: ${{ github.token }}
